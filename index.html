<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>04.11.26 — The Signal</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse,#1b1b1b,#030303 70%);color:#ddd;min-height:100vh;display:grid;place-items:center;font-family:Georgia,serif;text-align:center}.wrap{padding:24px;max-width:520px}.date{font:12px monospace;letter-spacing:6px;color:#777}h1{font-size:clamp(28px,8vw,46px);font-weight:400;letter-spacing:4px;line-height:1.25}.sub{font:11px monospace;letter-spacing:3px;color:#777}.box{position:relative;width:150px;height:125px;margin:55px auto 35px;cursor:pointer;animation:float 4s ease-in-out infinite}.base{position:absolute;bottom:0;width:150px;height:100px;background:linear-gradient(135deg,#333,#090909);border:1px solid #666;box-shadow:0 0 35px #000}.base:after{content:"";position:absolute;left:65px;width:18px;height:100%;background:#777;opacity:.3}.lid{position:absolute;top:12px;left:-5px;width:160px;height:28px;background:linear-gradient(#444,#111);border:1px solid #777;transition:1.2s;transform-origin:left bottom}.box.open .lid{transform:translateY(-75px) rotate(-28deg)}button{background:transparent;color:#ddd;border:1px solid #777;padding:14px 22px;letter-spacing:3px;font:12px monospace}button:active{background:#ddd;color:#000}.message{opacity:0;transform:translateY(12px);transition:1.4s;line-height:2;color:#aaa}.message.show{opacity:1;transform:none}@keyframes float{50%{transform:translateY(-9px)}}</style></head><body><main class="wrap"><div class="date">WEDNESDAY // 04.11.2026</div><h1>EVERYTHING<br>IS CONNECTED</h1><div class="sub">THE PAST · THE PRESENT · THE FUTURE</div><div class="box" id="box" role="button" tabindex="0" aria-label="Open the mystery box"><div class="base"></div><div class="lid"></div></div><div class="sub" id="hint">SOME THINGS ARE BETTER LEFT HIDDEN</div><p><button id="open">OPEN THE BOX</button></p><section class="message" id="message"><h2>THE BEGINNING IS THE END.</h2><p>Nothing ever disappears.<br>It only changes into something else.</p><p>04.11.2026</p><button onclick="location.reload()">TRY AGAIN</button></section><div class="sub" style="margin-top:40px">TICK · TOCK · TICK · TOCK</div></main><script>function openBox(){document.getElementById('box').classList.add('open');document.getElementById('hint').textContent='SOME SECRETS CANNOT BE BURIED';document.getElementById('open').hidden=true;setTimeout(()=>document.getElementById('message').classList.add('show'),850)}document.getElementById('open').addEventListener('click',openBox);document.getElementById('box').addEventListener('click',openBox);document.getElementById('box').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openBox()});</script></body></html>
